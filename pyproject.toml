[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchinu"
version = "0.1.0"
description = "Wire-rod coil load-arrangement monitoring at the BALCO lacing point (Hikvision camera, fine-tuned detectors)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "tzdata>=2024.1",  # Windows has no system timezone database for zoneinfo
]

[project.optional-dependencies]
# Heavy ML stack: only needed on the training box and the inference server.
ml = ["ultralytics>=8.4"]
postgres = ["psycopg[binary]>=3.1"]
# Microsoft SQL Server: also install "ODBC Driver 18 for SQL Server" on the machine.
mssql = ["pyodbc>=5.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
watchinu = "watchinu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline CSV fixtures

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
