# Lacing point, Material Gate (Parsabhata Road), BALCO. Hikvision PTZ "Camera 01" (PTZ locked).
#
# All coordinates are NORMALISED (0..1 of width/height) so the same file works for the
# main stream (2560x1440) and the sub-stream (640x360).
#
# Geometry calibrated on real main-stream frames of 2026-11-04 (view verified identical
# across all 9 clips: <0.5 px shift). bed_quad corners are fitted homographies from coil
# centres: far lane to a full linear 2x5 load (mean residual 7 px @1600x900), near lane
# to 4 visible rows (rear row is below the frame). Re-check after any camera change:
#   watchinu render-config --config configs/camera01.yaml --image <frame.jpg> --layout linear

camera:
  id: cam01
  name: "Lacing point - Material Gate"
  host: 10.110.4.8
  rtsp_port: 554
  streams:
    main: /Streaming/Channels/101   # 2560x1440 @20 fps, H.264, H.264+ off, 6144 kbps VBR
    sub: /Streaming/Channels/102    # 640x360 @20 fps, H.264, 1024 kbps VBR
  credentials_env:
    user: WATCHINU_CAM01_USER
    password: WATCHINU_CAM01_PASSWORD
  timezone: Asia/Kolkata
  osd_masks:
    - [[0.0, 0.035], [0.30, 0.035], [0.30, 0.105], [0.0, 0.105]]       # date/time overlay
    - [[0.715, 0.875], [0.85, 0.875], [0.85, 0.945], [0.715, 0.945]]   # "Camera 01" overlay
  static_region: [[0.45, 0.0], [1.0, 0.0], [1.0, 0.40], [0.45, 0.17]]  # shed wall + trusses
  reference_image: null   # set to a calibrated main-stream frame for the drift guard

slot_templates:
  std_2x5: {columns: 2, rows: 5}   # linear: 2 columns x 5 rows = 10 coils (confirmed on site)
  cc_2x7: {columns: 2, rows: 7}    # criss-cross: ~14 coils, near row cut off by the frame (VERIFY on footage)

bays:
  # Far lane: along the shed wall. Coils of this lane sit above the boundary line
  # (0.17,0.27)-(1.0,0.895); detections are assigned to a lane by their box centre.
  - id: far
    polygon: [[0.10, 0.17], [0.25, 0.17], [1.0, 0.48], [1.0, 0.895], [0.17, 0.27], [0.16, 0.20]]
    # u: 0 = road side, 1 = wall side; v: 0 = rear (near camera), 1 = front (cabin)
    bed_quad: [[0.838, 0.819], [1.037, 0.715], [0.285, 0.216], [0.16, 0.238]]
    slot_templates: {linear: std_2x5, criss_cross: cc_2x7}
  # Near lane: road side, below the boundary; trucks run off the left/bottom image edge.
  - id: near
    polygon: [[0.0, 0.20], [0.16, 0.20], [0.17, 0.27], [1.0, 0.895], [1.0, 1.0], [0.0, 1.0]]
    bed_quad: [[0.956, 2.098], [1.88, 1.936], [0.132, 0.278], [-0.064, 0.31]]
    slot_templates: {linear: std_2x5, criss_cross: cc_2x7}

visit:
  open_after_s: 30
  close_after_s: 120
  covered_after_s: 60
  reopen_after_s: 120
  provisional_after_s: 120
  max_visit_s: 10800
  max_gap_s: 60
  stage_min_confidence: 0.6

schedule:
  idle_interval_s: 5
  open_interval_s: 10
  provisional_interval_s: 10
  checkpoint_interval_s: 600
  change_spike: 0.10
  change_settle: 0.03
  lookback_s: 180
  drift_check_interval_s: 300

models:
  stage_classifier: null    # e.g. runs/stage/v1/weights/best.pt
  layout_classifier: null   # e.g. runs/layout/v1/weights/best.pt
  detector: null            # e.g. runs/detect/coil-v1/weights/best.pt
  detector_imgsz: 1280
  stage_imgsz: 224
  layout_imgsz: 384
  device: cpu               # "0" for the first CUDA GPU
